[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "manyhands"
version = "1.0.0"
description = "Run several local OCR models over the same page and show a human exactly which words they disagree on."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Booyaka101", email = "cbosch101@gmail.com" }]
keywords = [
    "ocr",
    "htr",
    "handwriting",
    "historical-documents",
    "ensemble",
    "rover",
    "transcription",
    "vlm",
    "archives",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "typer>=0.12.3,<1",
    "pillow>=10.4.0,<12",
    "pypdfium2>=5,<6",
    "numpy>=1.26,<3",
    "jinja2>=3.1,<4",
    "markupsafe>=2.1,<4",
    "churro-ocr>=0.3.0,<1",
]

[project.optional-dependencies]
# Local Hugging Face inference. Install torch first, for your CUDA build.
hf = ["churro-ocr[hf]>=0.3.0,<1"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/Booyaka101/manyhands"
Repository = "https://github.com/Booyaka101/manyhands"
Issues = "https://github.com/Booyaka101/manyhands/issues"
Changelog = "https://github.com/Booyaka101/manyhands/blob/main/CHANGELOG.md"

[project.scripts]
manyhands = "manyhands.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/manyhands"]

[tool.hatch.build.targets.sdist]
include = ["src/manyhands", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["manyhands", "conftest"]
